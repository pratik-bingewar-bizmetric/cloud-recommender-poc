name: Backend CI

# CI ONLY. This workflow never logs in to Azure, never uses publishing credentials or OIDC,
# never deploys, never runs database migrations and needs no secrets: every test is offline
# (mock LLM provider, in-memory / SQLite stand-ins, no PostgreSQL).

on:
  push:
    branches: [feature/backend-security-hardening, main]
  pull_request:
    branches: [feature/backend-security-hardening, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      LLM_PROVIDER: mock
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Verify the environment is consistent
        run: python -m pip check

      - name: Verify lock files are in sync (uv.lock <-> requirements files)
        run: |
          python -m pip install "uv==0.13.8"
          uv lock --check
          python scripts/sync_requirements.py --check

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

      - name: Backend tests
        # Per-test timeout (180 s, thread method) comes from pyproject.toml; faulthandler adds a
        # traceback of any test stuck for 2 minutes. The job itself is capped at 25 minutes.
        run: >
          python -m pytest -v -p no:cacheprovider
          -o faulthandler_timeout=120
          --durations=15
          --cov=cloud_recommender --cov-report=term --cov-report=xml
          --junitxml=pytest-report.xml

      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/pytest-report.xml
            backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend - lint, types, tests, build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Summarise
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          {
            echo "## Backend CI"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend (Python 3.12) | ${{ needs.backend.result }} |"
            echo "| Frontend (Node 20) | ${{ needs.frontend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI failed: see the failing job above."
            exit 1
          fi
          echo "CI passed."
