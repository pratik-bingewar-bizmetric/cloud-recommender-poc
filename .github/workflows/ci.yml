name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      APP_ENV: testing
      PYTHONUNBUFFERED: "1"
      VIRTUAL_ENV: ""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          activate-environment: false

      - name: Install Backend Dependencies via uv
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run mypy src tests

      - name: Run Pytest Test Suite
        run: uv run pytest -v --cov=cloud_recommender --cov-report=xml --cov-report=term

  frontend-quality:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          else
            echo "Frontend directory not yet initialized. Skipping."
          fi

      - name: Run Frontend Lint & Type Check
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm run lint --if-present
            npm run typecheck --if-present
          else
            echo "Frontend directory not yet initialized. Skipping."
          fi

      - name: Build Frontend Application
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm run build
          else
            echo "Frontend directory not yet initialized. Skipping."
          fi

  documentation-integrity:
    name: Docs & ADR Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Required Foundational Documents Exist
        run: |
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f .env.example || (echo "Missing .env.example" && exit 1)
          test -f docs/PRODUCT_REQUIREMENTS.md || (echo "Missing docs/PRODUCT_REQUIREMENTS.md" && exit 1)
          test -f docs/ARCHITECTURE.md || (echo "Missing docs/ARCHITECTURE.md" && exit 1)
          test -f docs/IMPLEMENTATION_ROADMAP.md || (echo "Missing docs/IMPLEMENTATION_ROADMAP.md" && exit 1)
          test -d docs/ADR || (echo "Missing docs/ADR directory" && exit 1)
          echo "All foundational governance and architectural documents are verified."

